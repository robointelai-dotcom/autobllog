# Replace domaincontroller.in server block with this style.
# This fixes white/blank screen on /global1/ and other client pages.

server {
    listen 80;
    server_name domaincontroller.in www.domaincontroller.in;
    return 301 https://domaincontroller.in$request_uri;
}

server {
    listen 443 ssl http2;
    server_name domaincontroller.in www.domaincontroller.in;

    # Keep your existing ssl_certificate and ssl_certificate_key lines here.
    # ssl_certificate /etc/letsencrypt/live/domaincontroller.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/domaincontroller.in/privkey.pem;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
